<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HabitPulseAI - AI-powered habit tracking for healthier routines" />
    <script>
      try {
        const theme = localStorage.getItem('habitpulse-theme');
        const selectedTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = selectedTheme;
        document.documentElement.dataset.bsTheme = selectedTheme;
        document.documentElement.style.colorScheme = selectedTheme;
      } catch {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.bsTheme = 'light';
      }
    </script>
    <title>HabitPulseAI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
